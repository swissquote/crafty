name: Benchmark

on:
  workflow_dispatch:
    inputs:
      permutations:
        description: "Comma-separated permutation names to run (empty = all)"
        required: false
        default: ""

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: yarn

      - name: Install hyperfine
        run: sudo apt-get install -y hyperfine

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run benchmarks
        run: node benchmarks/runner.js
        env:
          BENCH_PERMUTATIONS: ${{ inputs.permutations }}
