name: Node CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# give zero permissions to all jobs by default
permissions: {}

jobs:
  # ─── Job: Lint and checks that are needed only once ─────────
  lint:
    name: "✅ Base Checks"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    # Commit is needed to check coverage files against content
    - name: 📥 Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # This job executes PR code, so the token must not be left in .git/config
        persist-credentials: false
    - name: ⬢ Setup Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 22.x
        cache: 'yarn'
    - name: 📦 Install dependencies
      run: yarn install
    - name: 🔨 Build
      run: yarn build
    # Lint only once
    - name: 🔍 Lint
      run: yarn lint:ci

    # ─── Package size tracking ──────────────────────────────────
    - name: 📊 Restore baseline package sizes
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .pkg-sizes-baseline.json
        key: pkg-sizes-${{ github.event.pull_request.base.ref || github.ref_name }}-never-match
        restore-keys: |
          pkg-sizes-${{ github.event.pull_request.base.ref || github.ref_name }}-

    - name: 📏 Measure package sizes
      run: node utils/package-sizes.mjs measure --output .pkg-sizes-current.json

    - name: 📝 Generate size report
      run: |
        node utils/package-sizes.mjs report \
          --current .pkg-sizes-current.json \
          --baseline .pkg-sizes-baseline.json \
          --output-md .pkg-sizes-report.md \
          --output-summary .pkg-sizes-summary.txt

    - name: ⬆️ Upload size report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: size-report
        include-hidden-files: true
        retention-days: 1
        path: |
          .pkg-sizes-current.json
          .pkg-sizes-report.md
          .pkg-sizes-summary.txt

    - name: 🔄 Prepare baseline for cache
      if: github.event_name == 'push'
      run: cp .pkg-sizes-current.json .pkg-sizes-baseline.json

    - name: 💾 Save package sizes to cache
      if: github.event_name == 'push'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: .pkg-sizes-baseline.json
        key: pkg-sizes-${{ github.ref_name }}-${{ github.run_id }}

 # ─── Job: Build and test ─────────
  build:
    name: "🏗️ Build & Test"
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x, 24.x, 26.x]
        include:
        - os: macos-latest
          node-version: 24.x
        - os: macos-15
          node-version: 24.x
        # TODO : add Windows build
        # - os: windows-latest
        #   node-version: 24.x
          
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        # This job executes PR code, so the token must not be left in .git/config
        persist-credentials: false
    - name: ⬢ Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - name: ☕ Setup Java
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: 'zulu'
        java-version: '11'
    - name: 📦 Install dependencies
      run: yarn install
    - name: 🔨 Build
      run: yarn build
    - name: 🧪 Test
      run: yarn test:ci
      env:
        CI: true
    - name: ⬆️ Upload coverage reports
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      if: matrix.node-version == '24.x'
      with:
        name: reports-${{ matrix.os }}-${{ matrix.node-version }}
        retention-days: 1
        path: |
          **/coverage/lcov.info
          **/coverage/sonar-report.xml
          !node_modules/**

  # ─── Job: uploads coverage to SonarCloud with a short-lived OIDC token ─────────
  # Only runs for pushes and PRs from branches of this repository, never for forks
  # (GitHub withholds id-token from fork PRs) or dependency bots
  static_analysis:
    name: "🔬 Static Analysis"
    needs: build
    runs-on: ubuntu-latest
    if: >-
      success() && (
        github.event_name == 'push' || (
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          github.event.pull_request.user.login != 'renovate[bot]'
        )
      )
    permissions:
      contents: read
      id-token: write # exchanged for a short-lived SonarQube Cloud token
    steps:
    # Commit is needed to check coverage files against content
    - name: 📥 Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
        # Disabling shallow clone is needed by SonarQube
        fetch-depth: 0
    - name: ⬇️ Download reports
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        pattern: reports-*
        path: __reports
    - name: 📋 List report files
      run: find __reports -type f
    - name: 🔎 Collect Sonar report paths
      id: sonar_reports
      run: |
        test_reports=$(find __reports -name "sonar-report.xml" | sort | paste -sd, -)
        # The scanner action splits args on whitespace, only allow plain paths
        if [[ ! "$test_reports" =~ ^[A-Za-z0-9._/,-]+$ ]]; then
          echo "::error::Unexpected test report paths: $test_reports"
          exit 1
        fi
        echo "test_reports=$test_reports" >> "$GITHUB_OUTPUT"
        echo "project_version=$(git tag -l --sort=-creatordate --format='%(refname:short)' | head -n1)" >> "$GITHUB_OUTPUT"
    # Secretless analysis: trades the job's OIDC token for a 30 min scan-only token
    # and exports it as SONAR_TOKEN. Org and project key come from sonar-project.properties
    - name: 🔑 SonarQube Cloud Auth
      uses: SonarSource/sonarqube-auth-action@b372e2c2930aadfcc4f4399446da1e12772709ad # v1.2
    - name: 🔬 SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8
      with:
        args: >
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.testExecutionReportPaths=${{ steps.sonar_reports.outputs.test_reports }}
          -Dsonar.projectVersion=${{ steps.sonar_reports.outputs.project_version }}

  # ─── Job: publishes the package size report, does NOT run PR code ───
  # Always written to the job summary. In-repo PRs also get a comment; fork PRs only get
  # the summary, as GitHub downgrades their token to read-only whatever we request here
  size_report:
    name: "📦 Package Size Report"
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # PR comment, in-repo PRs only
      checks: write # check run, pushes only
    steps:
    - name: ⬇️ Download size report
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: size-report
        path: .

    - name: 📝 Write job summary
      run: cat .pkg-sizes-report.md >> "$GITHUB_STEP_SUMMARY"

    - name: 💬 Post PR comment
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      if: >-
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]'
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('.pkg-sizes-report.md', 'utf8');
          const marker = '<!-- pkg-size-report -->';
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
          });
          const existing = comments.find(c => c.body.includes(marker));
          const fullBody = marker + '\n' + body;
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: fullBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: fullBody,
            });
          }

    - name: ✅ Create check run with size report
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
      if: github.event_name == 'push'
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('.pkg-sizes-summary.txt', 'utf8').trim();
          const report = fs.readFileSync('.pkg-sizes-report.md', 'utf8');
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            head_sha: context.sha,
            name: 'Package Size Report',
            status: 'completed',
            conclusion: 'success',
            output: {
              title: summary,
              summary: report,
            },
          });
