name: Node CI

on:
  push:
    branches: [ master ]
  pull_request_target:
    branches: [ master ]

jobs:
  # ─── Job: Lint and checks that are needed only once ─────────
  lint:
    name: "✅ Base Checks"
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: read
    steps:
    # Commit is needed to check coverage files against content
    - name: 📥 Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        # This job executes PR code, so the token must not be left in .git/config
        persist-credentials: false
        allow-unsafe-pr-checkout: true
    - name: ⬢ Setup Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: 22.x
        cache: 'yarn'
    - name: 📦 Install dependencies
      run: yarn install
    - name: 🔨 Build
      run: yarn build
    # Lint only once
    - name: 🔍 Lint
      run: yarn lint:ci

    # ─── Package size tracking ──────────────────────────────────
    - name: 📊 Restore baseline package sizes
      uses: actions/cache/restore@v5
      with:
        path: .pkg-sizes-baseline.json
        key: pkg-sizes-${{ github.event.pull_request.base.ref || github.ref_name }}-never-match
        restore-keys: |
          pkg-sizes-${{ github.event.pull_request.base.ref || github.ref_name }}-

    - name: 📏 Measure package sizes
      run: node utils/package-sizes.mjs measure --output .pkg-sizes-current.json

    - name: 📝 Generate size report
      run: |
        node utils/package-sizes.mjs report \
          --current .pkg-sizes-current.json \
          --baseline .pkg-sizes-baseline.json \
          --output-md .pkg-sizes-report.md \
          --output-summary .pkg-sizes-summary.txt

    - name: ⬆️ Upload size report
      uses: actions/upload-artifact@v7
      with:
        name: size-report
        include-hidden-files: true
        retention-days: 1
        path: |
          .pkg-sizes-current.json
          .pkg-sizes-report.md
          .pkg-sizes-summary.txt

    - name: 🔄 Prepare baseline for cache
      if: github.event_name == 'push'
      run: cp .pkg-sizes-current.json .pkg-sizes-baseline.json

    - name: 💾 Save package sizes to cache
      if: github.event_name == 'push'
      uses: actions/cache/save@v5
      with:
        path: .pkg-sizes-baseline.json
        key: pkg-sizes-${{ github.ref_name }}-${{ github.run_id }}

 # ─── Job: Build and test ─────────
  build:
    name: "🏗️ Build & Test"
    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [22.x, 24.x]
        include:
        - os: macos-latest
          node-version: 24.x
        - os: macos-14
          node-version: 24.x
        # TODO : add Windows build
        # - os: windows-latest
        #   node-version: 24.x
          
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    steps:
    - name: 📥 Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        # This job executes PR code, so the token must not be left in .git/config
        persist-credentials: false
        allow-unsafe-pr-checkout: true
    - name: ⬢ Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'yarn'
    - name: ☕ Setup Java
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: 'zulu'
        java-version: '11'
    - name: 📦 Install dependencies
      run: yarn install
    - name: 🔨 Build
      run: yarn build
    - name: 🧪 Test
      run: yarn test:ci
      env:
        CI: true
    - name: ⬆️ Upload coverage reports
      uses: actions/upload-artifact@v7
      if: matrix.node-version == '24.x'
      with:
        name: reports-${{ matrix.os }}-${{ matrix.node-version }}
        retention-days: 1
        path: |
          **/coverage/lcov.info
          **/coverage/sonar-report.xml
          !node_modules/**

  # ─── Job: uploads coverage using SONAR_TOKEN. Checks out PR code and feeds
  # it to the scanner, but never executes it (no install/build/test here).
  # SONAR_TOKEN is therefore exposed to an attacker-controlled workspace: keep
  # it scoped to analysis of this project only. ─────────
  static_analysis:
    name: "🔬 Static Analysis"
    needs: build
    runs-on: ubuntu-latest
    if: success()
    permissions:
      contents: read
    steps:
    # Commit is needed to check coverage files against content
    - name: 📥 Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
        allow-unsafe-pr-checkout: true
        # Disabling shallow clone is needed by SonarQube
        fetch-depth: 0
    - name: ⬇️ Download reports
      uses: actions/download-artifact@v8
      with:
        pattern: reports-*
        path: __reports
    - name: 📋 List report files
      run: find __reports -type f
    - name: 🔎 Collect Sonar report paths
      id: sonar_reports
      run: |
        echo "test_reports=$(find __reports -name "sonar-report.xml" | tr '\n' ',' | sed 's/,$//')" >> $GITHUB_OUTPUT
        echo "project_version=$(git tag -l --sort=-creatordate --format='%(refname:short)' | head -n1)" >> $GITHUB_OUTPUT
    - name: 🔬 SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v8
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.testExecutionReportPaths=${{ steps.sonar_reports.outputs.test_reports }}
          -Dsonar.projectVersion=`${{ steps.sonar_reports.outputs.project_version  }}`

  # ─── Job: posts package size report on PRs, does NOT run PR code ───
  size_report:
    name: "📦 Package Size Report"
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      checks: write
    steps:
    - name: ⬇️ Download size report
      uses: actions/download-artifact@v8
      with:
        name: size-report
        path: .

    - name: 💬 Post PR comment
      uses: actions/github-script@v9
      if: github.event_name == 'pull_request_target'
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync('.pkg-sizes-report.md', 'utf8');
          const marker = '<!-- pkg-size-report -->';
          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
          });
          const existing = comments.find(c => c.body.includes(marker));
          const fullBody = marker + '\n' + body;
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body: fullBody,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: fullBody,
            });
          }

    - name: ✅ Create check run with size report
      uses: actions/github-script@v9
      with:
        script: |
          const fs = require('fs');
          const summary = fs.readFileSync('.pkg-sizes-summary.txt', 'utf8').trim();
          const report = fs.readFileSync('.pkg-sizes-report.md', 'utf8');
          await github.rest.checks.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            head_sha: context.payload.pull_request?.head?.sha || context.sha,
            name: 'Package Size Report',
            status: 'completed',
            conclusion: 'success',
            output: {
              title: summary,
              summary: report,
            },
          });
