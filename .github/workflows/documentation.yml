name: Documentation

on:
  push:
    branches: [ master ]

jobs:
  documentation:
    runs-on: ubuntu-latest
    # Needed by github-pages-deploy-action to push to the gh-pages branch
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - uses: docker://daux/daux.io:0.26.1
      name: Generate documentation
      with:
        args: daux generate --themes=docs_theme
    - name: Deploy 🚀
      uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
      with:
        folder: "static"
        branch: gh-pages
